<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="none">
  <defs>
    <filter id="feather" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="48" />
    </filter>
  </defs>
  <!-- The top and its rounded corners stay outside the mask's visible area. -->
  <rect x="120" y="-400" width="760" height="1300" rx="160" fill="white" filter="url(#feather)" />
</svg>
